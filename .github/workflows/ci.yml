name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        storage: [parquet, duckdb]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --extra dev
        working-directory: backend
      - name: Lint
        run: uv run ruff check src tests
        working-directory: backend
      - name: Test
        # The suite is parameterised over both backends already; this pins the
        # default so a storage-specific regression cannot hide.
        run: uv run pytest -q
        working-directory: backend
        env:
          DATAQ_STORAGE: ${{ matrix.storage }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dataq:ci .
